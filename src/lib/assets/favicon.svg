<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- Dark Background (Full Bleed, No Rounded Rectangle) -->
  <rect width="32" height="32" fill="#121214"/>
  
  <!-- Tightly Packed Transposed Gantt Columns -->
  <!-- We leave a 1.5px margin on the left/right and 1.5px top/bottom -->
  <!-- 32 - 3 (margins) = 29 width total. 3 columns = 9px width each, 1px gap -->
  <!-- 32 - 3 (margins) = 29 height total. -->
  <g transform="translate(1.5, 1.5)">
    
    <!-- Column 1 -->
    <rect x="0" y="0" width="9" height="29" fill="#1C1C1E"/>
    <rect x="0" y="0" width="9" height="7" fill="#f0c652"/>
    <rect x="0" y="8" width="9" height="15" fill="#999999"/>
    <rect x="0" y="24" width="9" height="5" fill="#00E5FF"/>

    <!-- Column 2 -->
    <rect x="10" y="0" width="9" height="29" fill="#1C1C1E"/>
    <rect x="10" y="0" width="9" height="13" fill="#999999"/>
    <rect x="10" y="14" width="9" height="5" fill="#00E5FF"/>
    <rect x="10" y="20" width="9" height="9" fill="#f0c652"/>

    <!-- Column 3 -->
    <rect x="20" y="0" width="9" height="29" fill="#1C1C1E"/>
    <rect x="20" y="0" width="9" height="5" fill="#00E5FF"/>
    <rect x="20" y="6" width="9" height="9" fill="#f0c652"/>
    <rect x="20" y="16" width="9" height="13" fill="#999999"/>
  </g>

  <!-- Centered Text Overlay with Stroke (No Backdrop Rect) -->
  <text x="16" y="17" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Sans', sans-serif" 
        font-size="6.5" 
        font-weight="900" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        dominant-baseline="central"
        stroke="#121214"
        stroke-width="1.2"
        stroke-linejoin="round"
        paint-order="stroke fill">フェスTT</text>
</svg>
